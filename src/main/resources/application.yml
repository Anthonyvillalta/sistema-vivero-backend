server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: sistema-vivero
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:viverodb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:''}}
    hikari:
      initialization-fail-timeout: 5000
      connection-timeout: 30000
      validation-timeout: 5000
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: Vml2ZXJvVmlsbGFWZXJkZVNlY3VyZUpXVEtleU11c3RCZUxvbmdFbm91Z2hGb3JITUFDU0hBNTEy
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.vivero: INFO
