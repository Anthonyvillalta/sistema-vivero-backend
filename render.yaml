services:
  - type: web
    name: sistema-vivero-backend
    region: oregon
    plan: free
    env: docker
    dockerfilePath: Dockerfile
    build:
      dockerfilePath: Dockerfile
      context: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Configure these in Render Dashboard -> Settings -> Environment Variables
      # Do NOT set values here - they would override dashboard settings
      - key: PORT
        value: 10000
    healthCheck:
      path: /api/auth/health
      interval: 60
      timeout: 10