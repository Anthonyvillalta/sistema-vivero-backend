services:
  - type: web
    name: sistema-vivero-backend
    region: oregon
    plan: free
    env: docker
    dockerfilePath: Dockerfile
    build:
      dockerfilePath: Dockerfile
      context: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        value: YOUR_DB_HOST_HERE
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: vivero_villa_verde
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: YOUR_DB_PASSWORD_HERE
    healthCheck:
      path: /api/auth/health
      interval: 60
      timeout: 10